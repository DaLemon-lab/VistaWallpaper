<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vista</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap');

  :root{
    --bg:#F4F6F8; --bg-grad-a:#F4F6F8; --bg-grad-b:#F4F6F8;
    --panel:#FFFFFF; --panel-alt:#F6F7F9;
    --text:#151A23; --muted:#5B6472;
    --header:#12161F; --header2:#12161F;
    --accent:#2F5DE0; --accent2:#2447B5; --accent-dark:#1E3A93;
    --border:#E2E5EA; --link:#2F5DE0; --danger:#D14343; --ok:#1B8A5A;
    --ring: rgba(47,93,224,.28);
    --radius-lg:12px; --radius-md:9px; --radius-sm:7px;
  }
  [data-theme="dark"]{
    --bg:#0E1116; --bg-grad-a:#0E1116; --bg-grad-b:#0E1116;
    --panel:#161B23; --panel-alt:#1B212B;
    --text:#E7EAEF; --muted:#8B93A1;
    --header:#0A0D12; --header2:#0A0D12;
    --accent:#5B84EE; --accent2:#4A6FD6; --accent-dark:#3E5CC0;
    --border:#262D39; --link:#5B84EE; --danger:#E4685F; --ok:#2FA774;
    --ring: rgba(91,132,238,.35);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Inter',-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
  }
  h1,h2,h3,h4{font-family:'Sora',sans-serif;letter-spacing:-.01em;font-weight:700;}
  a{color:var(--link);text-decoration:none;cursor:pointer;}
  button{font-family:inherit;cursor:pointer;}
  img{max-width:100%;display:block;}
  ::selection{background:var(--accent);color:#fff;}

  /* Ad banner */
  .ad-banner{position:relative;width:100%;background:#000;cursor:pointer;overflow:hidden;line-height:0;border-bottom:1px solid var(--border);}
  .ad-banner img,.ad-banner video{width:100%;max-height:180px;object-fit:cover;display:block;}
  .ad-banner .ad-tag{position:absolute;top:8px;left:10px;background:rgba(0,0,0,.55);color:#fff;font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:4px;font-family:'Inter',sans-serif;}

  /* Header */
  header{
    background:var(--header);
    color:#fff;display:flex;align-items:center;gap:14px;
    padding:13px 22px;flex-wrap:wrap;
    border-bottom:1px solid rgba(255,255,255,.06);
    position:sticky;top:0;z-index:50;
  }
  .logo{font-family:'Sora',sans-serif;font-weight:700;font-size:19px;letter-spacing:.1px;white-space:nowrap;cursor:pointer;display:flex;align-items:center;}
  .searchbar{flex:1;display:flex;min-width:200px;max-width:560px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:var(--radius-sm);overflow:hidden;transition:box-shadow .2s,border-color .2s;}
  .searchbar:focus-within{box-shadow:0 0 0 3px var(--ring);border-color:var(--accent);}
  .searchbar input{flex:1;padding:9px 14px;border:none;background:transparent;color:#fff;font-size:14px;outline:none;}
  .searchbar input::placeholder{color:rgba(255,255,255,.5);}
  .searchbar button{background:var(--accent);border:none;padding:0 18px;font-weight:600;color:#fff;border-radius:0;margin:0;font-size:13px;transition:background .15s;}
  .searchbar button:hover{background:var(--accent-dark);}
  .navlinks{display:flex;align-items:center;gap:6px;font-size:13px;margin-left:auto;}
  .navlinks .navbtn{background:transparent;border:1px solid rgba(255,255,255,.14);color:#fff;padding:7px 12px;border-radius:var(--radius-sm);font-size:13px;transition:background .15s,border-color .15s;}
  .navlinks .navbtn:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.26);}
  .subheader{background:rgba(0,0,0,.22);color:#c7ccd6;padding:7px 22px;display:flex;gap:8px;font-size:12.5px;overflow-x:auto;}
  .subheader span{cursor:pointer;white-space:nowrap;padding:4px 11px;border-radius:var(--radius-sm);background:rgba(255,255,255,.05);transition:background .15s;}
  .subheader span:hover{background:rgba(255,255,255,.14);}

  /* Layout */
  .layout{display:flex;max-width:1400px;margin:0 auto;align-items:flex-start;}
  aside{width:230px;flex-shrink:0;background:var(--panel);margin:18px;border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;position:sticky;top:90px;box-shadow:0 10px 30px rgba(60,20,100,.06);}
  aside h3{font-size:13px;margin:0 0 10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);}
  aside .genre-list{display:flex;flex-direction:column;gap:3px;margin-bottom:16px;}
  aside .genre-list button{background:none;border:none;text-align:left;padding:8px 10px;border-radius:var(--radius-sm);font-size:13.5px;color:var(--text);position:relative;transition:background .15s,color .15s;}
  aside .genre-list button::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--border);margin-right:9px;vertical-align:middle;transition:background .15s;}
  aside .genre-list button.active{background:var(--accent);color:#fff;font-weight:600;}
  aside .genre-list button.active::before{background:#fff;}
  aside .genre-list button:hover:not(.active){background:var(--panel-alt);}
  main{flex:1;padding:18px;min-width:0;}

  /* Cards */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:18px;}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;display:flex;flex-direction:column;box-shadow:0 1px 2px rgba(16,24,40,.04);transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;}
  .card:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(16,24,40,.10);border-color:var(--accent);}
  .thumb-wrap{aspect-ratio:9/16;overflow:hidden;background:#000;position:relative;}
  .thumb-wrap img,.thumb-wrap video{width:100%;height:100%;object-fit:cover;user-select:none;-webkit-user-drag:none;pointer-events:none;}
  .card-body{padding:12px;display:flex;flex-direction:column;gap:5px;flex:1;}
  .card-body h4{margin:0;font-size:14.5px;font-family:'Sora',sans-serif;}
  .price{font-weight:700;color:var(--text);font-size:14px;}
  .badge{display:inline-block;font-size:10.5px;background:rgba(27,138,90,.13);color:var(--ok);font-weight:700;padding:3px 9px;border-radius:var(--radius-sm);width:fit-content;letter-spacing:.02em;}
  .badge.live{background:rgba(47,93,224,.12);color:var(--accent);}
  .tags{display:flex;flex-wrap:wrap;gap:5px;}
  .tag{font-size:10px;background:var(--panel-alt);border:1px solid var(--border);padding:2px 8px;border-radius:var(--radius-sm);color:var(--muted);}
  .card button.view{margin-top:auto;background:var(--accent);border:none;border-radius:var(--radius-sm);padding:8px;font-size:13px;font-weight:600;color:#fff;transition:background .15s;}
  .card button.view:hover{background:var(--accent-dark);}

  /* Forms */
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px;max-width:640px;box-shadow:0 1px 3px rgba(16,24,40,.06);}
  .panel.wide{max-width:820px;}
  .settings-section{border-top:1px solid var(--border);padding-top:18px;margin-top:22px;}
  .settings-section:first-of-type{border-top:none;margin-top:0;padding-top:0;}
  .settings-section h3{font-size:15px;margin:0 0 4px;}
  .manage-row{display:flex;align-items:center;gap:10px;border:1px solid var(--border);border-radius:var(--radius-md);padding:8px 10px;margin-top:8px;background:var(--panel-alt);}
  .manage-row img,.manage-row video{width:34px;height:34px;border-radius:6px;object-fit:cover;background:#000;flex-shrink:0;}
  .manage-row .info{flex:1;min-width:0;}
  .manage-row .info b{font-size:13px;display:block;}
  .manage-row .info span{font-size:11.5px;color:var(--muted);}
  .panel h2{margin-top:0;font-size:19px;}
  label{display:block;font-size:12.5px;margin:14px 0 5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;}
  input[type=text],input[type=number],input[type=password],input[type=email],textarea,select{
    width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--panel-alt);color:var(--text);font-size:14px;font-family:inherit;transition:border-color .15s,box-shadow .15s;
  }
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--ring);}
  input[type=file]{margin-top:4px;color:var(--text);}
  .file-preview{margin-top:8px;}
  .file-preview img,.file-preview video{max-width:160px;max-height:220px;border-radius:var(--radius-sm);border:1px solid var(--border);background:#000;object-fit:cover;}
  .file-preview .fp-empty{font-size:12px;color:var(--muted);}
  textarea{min-height:70px;resize:vertical;}
  .row2{display:flex;gap:12px;}
  .row2 > div{flex:1;}
  .checklist{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;}
  .checklist label{display:flex;align-items:center;gap:5px;font-weight:400;text-transform:none;background:var(--panel-alt);border:1px solid var(--border);padding:5px 10px;border-radius:999px;font-size:12px;margin:0;color:var(--text);}
  .checklist input{width:auto;}
  .btn{background:var(--accent);border:1px solid var(--accent);border-radius:var(--radius-sm);padding:9px 18px;font-weight:600;font-size:13.5px;margin-top:14px;color:#fff;transition:background .15s,border-color .15s;}
  .btn:hover{background:var(--accent-dark);border-color:var(--accent-dark);}
  .btn:active{transform:translateY(1px);}
  .btn.secondary{background:var(--panel-alt);border:1px solid var(--border);color:var(--text);}
  .btn.secondary:hover{background:var(--panel);border-color:var(--muted);}
  .btn.danger{background:var(--danger);color:#fff;border:1px solid var(--danger);}
  .btn.danger:hover{background:#b23434;border-color:#b23434;}
  .hint{font-size:12px;color:var(--muted);margin-top:2px;}
  .msg{padding:9px 12px;border-radius:var(--radius-sm);font-size:13px;margin-top:10px;}
  .msg.ok{background:rgba(31,169,122,.15);color:var(--ok);}
  .msg.err{background:rgba(224,82,122,.15);color:var(--danger);}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{text-align:left;padding:10px 8px;}
  tr{border-bottom:1px solid var(--border);}
  th{color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;}

  /* Modal */
  .overlay{position:fixed;inset:0;background:rgba(10,13,18,.6);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
  .modal{background:var(--panel);border-radius:var(--radius-lg);max-width:520px;width:100%;max-height:88vh;overflow-y:auto;padding:22px;position:relative;box-shadow:0 20px 48px rgba(10,13,18,.28);}
  .modal .close{position:absolute;top:12px;right:14px;background:var(--panel-alt);border:1px solid var(--border);width:28px;height:28px;border-radius:50%;font-size:18px;color:var(--muted);line-height:1;}
  .detail-thumb{aspect-ratio:9/16;max-height:340px;margin:0 auto;background:#000;border-radius:var(--radius-md);overflow:hidden;}
  .detail-thumb img,.detail-thumb video{width:100%;height:100%;object-fit:cover;pointer-events:none;user-select:none;-webkit-user-drag:none;}
  .tabs{display:flex;gap:6px;margin-bottom:14px;border-bottom:1px solid var(--border);}
  .tabs button{background:none;border:none;padding:8px 12px;font-size:14px;border-bottom:2px solid transparent;color:var(--text);}
  .tabs button.active{border-color:var(--accent);font-weight:700;color:var(--accent);}
  .sub-card{border:1px solid var(--border);border-radius:var(--radius-md);padding:12px;display:flex;gap:12px;align-items:center;margin-bottom:8px;background:var(--panel);}
  .sub-card img{width:38px;height:38px;border-radius:8px;object-fit:cover;background:var(--panel-alt);}
  .sub-card .info{flex:1;min-width:0;}
  .sub-card .info b{font-size:13.5px;font-family:'Sora',sans-serif;}
  .sub-card .info .price-line{font-size:12px;color:var(--muted);}
  .sub-card .info .desc-line{font-size:12px;color:var(--muted);margin-top:2px;}
  footer{text-align:center;padding:24px;font-size:12px;color:var(--muted);}
  .disclaimer{max-width:1400px;margin:12px auto;padding:12px 22px;font-size:12px;color:var(--muted);}
  .empty{padding:44px;text-align:center;color:var(--muted);}
</style>
</head>
<body>

<div id="adBannerRoot"></div>
<header>
  <div class="logo" onclick="setView('browse')" id="logoWrap"></div>
  <div class="searchbar">
    <input id="searchInput" type="text" placeholder="Search wallpapers, genres..." oninput="renderBrowse()">
    <button onclick="renderBrowse()">Search</button>
  </div>
  <div class="navlinks" id="navlinks"></div>
</header>
<div class="subheader" id="subheader"></div>

<div class="layout">
  <aside id="sidebar"></aside>
  <main id="main"></main>
</div>

<footer>Vista, a simple wallpaper marketplace</footer>

const IDB_NAME = "vista_store";
const IDB_STORE = "kv";
const IDB_KEY = "state";

function openIDB(){
  return new Promise((resolve, reject)=>{
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = e=>{
      const d = e.target.result;
      if(!d.objectStoreNames.contains(IDB_STORE)) d.createObjectStore(IDB_STORE);
    };
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
  });
}
async function idbGet(key){
  const d = await openIDB();
  return new Promise((resolve, reject)=>{
    const tx = d.transaction(IDB_STORE, 'readonly');
    const r = tx.objectStore(IDB_STORE).get(key);
    r.onsuccess = ()=>resolve(r.result);
    r.onerror = ()=>reject(r.error);
  });
}
async function idbSet(key, value){
  const d = await openIDB();
  return new Promise((resolve, reject)=>{
    const tx = d.transaction(IDB_STORE, 'readwrite');
    const r = tx.objectStore(IDB_STORE).put(value, key);
    r.onsuccess = ()=>resolve();
    r.onerror = ()=>reject(r.error);
  });
}

let db = { users:[], wallpapers:[], subscriptions:[], genres:["Nature","Abstract","Minimal","Space","Animals","Dark","Anime"], currentUserEmail:null, theme:"dark", logo:null, ad:{ media:null, mediaType:null, link:"" } };

async function loadDB(){
  try{
    const saved = await idbGet(IDB_KEY);
    if(saved){
      db = saved;
      if(db.logo === undefined) db.logo = null;
      if(!db.ad) db.ad = { media:null, mediaType:null, link:"" };
      db.subscriptions.forEach(s=>{ if(s.description === undefined) s.description = ""; });
    }
  }catch(e){ console.error('Could not load saved data', e); }
}
async function saveDB(){
  await idbSet(IDB_KEY, db);
}

function currentUser(){ return db.users.find(u=>u.email===db.currentUserEmail) || null; }
function findSub(id){ return db.subscriptions.find(s=>s.id===id); }
function findWallpaper(id){ return db.wallpapers.find(w=>w.id===id); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

/* ---------------- THEME ---------------- */
function applyTheme(){ document.documentElement.setAttribute('data-theme', db.theme); }

/* ---------------- STATE ---------------- */
let view = "browse"; // browse | add-wallpaper | add-sub | users | account | settings | site-settings
let activeGenre = null;

/* ---------------- LOGO ---------------- */
function renderLogo(){
  const el = document.getElementById('logoWrap');
  if(!el) return;
  const src = db.logo || DEFAULT_LOGO;
  el.innerHTML = `<img src="${src}" alt="Vista" style="height:32px;width:32px;border-radius:7px;object-fit:cover;vertical-align:middle;margin-right:8px;"><span style="vertical-align:middle;">Vista</span>`;
}

/* ---------------- AD BANNER (top of screen) ---------------- */
function renderAdBanner(){
  const root = document.getElementById('adBannerRoot');
  const ad = db.ad;
  if(!ad || !ad.media){ root.innerHTML = ''; return; }
  const mediaHtml = ad.mediaType === 'video'
    ? `<video src="${ad.media}" muted autoplay loop playsinline></video>`
    : `<img src="${ad.media}" alt="Advertisement">`;
  root.innerHTML = `<div class="ad-banner" onclick="handleAdClick()"><span class="ad-tag">Ad</span>${mediaHtml}</div>`;
}
function handleAdClick(){
  const link = (db.ad && db.ad.link || '').trim();
  if(link) window.open(link, '_blank', 'noopener');
}

/* ---------------- NAV / HEADER ---------------- */
function renderNav(){
  const u = currentUser();
  const nav = document.getElementById('navlinks');
  let html = "";
  if(u){
    html += `<button class="navbtn" onclick="setView('account')">👤 ${escapeHtml(u.name)}</button>`;
    if(u.isAdmin){
      html += `<button class="navbtn" onclick="setView('add-wallpaper')">+ Wallpaper</button>`;
      html += `<button class="navbtn" onclick="setView('add-sub')">+ Subscription</button>`;
      html += `<button class="navbtn" onclick="setView('users')">Users</button>`;
      html += `<button class="navbtn" onclick="setView('site-settings')" title="Website Settings">🛠 Website</button>`;
    }
    html += `<button class="navbtn" onclick="setView('settings')">⚙ Settings</button>`;
    html += `<button class="navbtn" onclick="logout()">Log Out</button>`;
  } else {
    html += `<button class="navbtn" onclick="openAuthModal('login')">Sign In</button>`;
    html += `<button class="navbtn" onclick="openAuthModal('register')">Create Account</button>`;
    html += `<button class="navbtn" onclick="setView('settings')">⚙ Settings</button>`;
  }
  nav.innerHTML = html;

  const sh = document.getElementById('subheader');
  sh.innerHTML = `<span onclick="setView('browse')">All Wallpapers</span>` +
    db.subscriptions.map(s=>`<span onclick="setView('browse');scrollToSubs()">${escapeHtml(s.name)}</span>`).join('');
}

function scrollToSubs(){ setTimeout(()=>{ const el = document.getElementById('subsSection'); if(el) el.scrollIntoView({behavior:'smooth'}); },50); }

function setView(v){ view = v; render(); window.scrollTo(0,0); }
function logout(){ db.currentUserEmail = null; saveDB(); setView('browse'); }

/* ---------------- SIDEBAR (genres) ---------------- */
function renderSidebar(){

/* ---------------- DOWNLOAD FLOW ---------------- */
async function startDownload(wallpaperId){
  const w = findWallpaper(wallpaperId);
  const choice = w.phoneFile && w.pcFile ? prompt('Download which version? Type "phone" or "pc"', 'pc') : (w.pcFile? 'pc':'phone');
  if(choice===null) return;
  const key = choice.trim().toLowerCase()==='phone' ? 'phoneFile' : 'pcFile';
  const dataUrl = w[key] || w.pcFile || w.phoneFile;
  if(!dataUrl){ alert('No file available for that version.'); return; }

  const ext = dataUrl.startsWith('data:video') ? 'mp4' : 'png';
  const filename = (w.name.replace(/[^a-z0-9]+/gi,'_') || 'wallpaper') + '_' + key.replace('File','') + '.' + ext;
  const blob = dataURLtoBlob(dataUrl);

  if(window.showSaveFilePicker){
    try{
      const handle = await window.showSaveFilePicker({ suggestedName: filename });
      const writable = await handle.createWritable();
      await writable.write(blob);
      await writable.close();
      return;
    }catch(err){
      if(err && err.name === 'AbortError') return; // user cancelled
      // fall through to fallback
    }
  }
  // Fallback: browser-default save dialog (location chosen by browser settings, not per-file here)
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
  alert('Your browser doesn\'t support choosing a save location per-download, so this used your browser\'s default download prompt/folder instead.');
}
function dataURLtoBlob(dataUrl){
  const [meta, b64] = dataUrl.split(',');
  const mime = meta.match(/:(.*?);/)[1];
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], {type:mime});
}

function previewFile(inputId, previewId){
  const input = document.getElementById(inputId);
  const box = document.getElementById(previewId);
  const file = input.files[0];
  if(!file){ box.innerHTML = ''; return; }
  fileToDataUrl(file).then(dataUrl=>{
    if(file.type.startsWith('video')){
      box.innerHTML = `<video src="${dataUrl}" controls muted loop></video>`;
    } else {
      box.innerHTML = `<img src="${dataUrl}">`;
    }
  }).catch(()=>{ box.innerHTML = `<span class="fp-empty">Couldn't preview this file.</span>`; });
}
function fileToDataUrl(file){
  return new Promise((res,rej)=>{
    const r = new FileReader();
    r.onload = ()=>res(r.result);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}
async function saveWallpaper(){

  const thumbnail = await fileToDataUrl(thumbFile);
  const phoneFile = phoneFileEl ? await fileToDataUrl(phoneFileEl) : null;
  const pcFile = pcFileEl ? await fileToDataUrl(pcFileEl) : null;

  const newWallpaper = { id: uid(), name, description:desc, cost, maxResPC, live, thumbnail, phoneFile, pcFile, requiredSub: subId, genres };

}

      <div id="adFilePreview" class="file-preview"></div>
      <label>Link (where clicking the ad should take visitors)</label>
      <input type="text" id="adLink" placeholder="https://example.com" value="${escapeHtml(ad.link||'')}">
      <button class="btn" onclick="saveAd()">Save Ad</button>
      ${ad.media ? `<button class="btn danger" onclick="removeAd()">Remove Ad</button>` : ''}
      <div id="adMsg"></div>
    </div>

    <div class="settings-section">
      <h3>Manage Wallpapers</h3>
      <p class="hint">Delete wallpapers from the store.</p>
      ${db.wallpapers.length ? db.wallpapers.map(w=>`
        <div class="manage-row">
          ${mediaTag(w.thumbnail,'image',false)}
          <div class="info"><b>${escapeHtml(w.name)}</b><span>${w.cost>0?'$'+w.cost.toFixed(2):'Free'}${w.live?' · Live':''}</span></div>
          <button class="btn danger" style="margin-top:0;" onclick="deleteWallpaper('${w.id}')">Delete</button>
        </div>`).join('') : `<div class="empty">No wallpapers yet.</div>`}
    </div>

    <div class="settings-section">
      <h3>Manage Genres</h3>
      <div class="checklist">
        ${db.genres.map(g=>`<label>${escapeHtml(g)} <button class="btn danger" style="margin:0 0 0 6px;padding:2px 8px;font-size:11px;" onclick="deleteGenre('${g.replace(/'/g,"\\'")}')">×</button></label>`).join('')}
      </div>
      <div class="row2" style="margin-top:10px;">
        <div><input type="text" id="siteNewGenre" placeholder="New genre name"></div>
        <div style="flex:0;"><button class="btn secondary" style="margin-top:0;" onclick="addGenreFromSettings()">Add genre</button></div>
      </div>
    </div>
  </div>`;
}
async function saveLogo(){
  const file = document.getElementById('logoFile').files[0];
  const msg = document.getElementById('logoMsg');
  if(!file){ msg.innerHTML = `<div class="msg err">Choose an image first.</div>`; return; }
  const dataUrl = await fileToDataUrl(file);
  const prevLogo = db.logo;
  db.logo = dataUrl;
  try{ await saveDB(); }catch(e){ db.logo = prevLogo; msg.innerHTML = `<div class="msg err">Could not save: ${escapeHtml(e && e.message ? e.message : String(e))}.</div>`; return; }
  msg.innerHTML = `<div class="msg ok">Logo updated.</div>`;
  renderSiteSettings(); renderLogo();
}
function resetLogo(){
  db.logo = null;
  saveDB();
  renderSiteSettings(); renderLogo();
}
async function saveAd(){
  const file = document.getElementById('adFile').files[0];
  const link = document.getElementById('adLink').value.trim();
  const msg = document.getElementById('adMsg');
  const prevAd = db.ad;
  let media = db.ad ? db.ad.media : null;
  let mediaType = db.ad ? db.ad.mediaType : null;
  if(file){
    if(file.type!=='image/png' && file.type!=='video/mp4'){
      msg.innerHTML = `<div class="msg err">Please choose a PNG image or an MP4 video.</div>`; return;
    }
    media = await fileToDataUrl(file);
    mediaType = file.type==='video/mp4' ? 'video' : 'image';
  }
  if(!media){ msg.innerHTML = `<div class="msg err">Upload a PNG or MP4 for the ad.</div>`; return; }
  db.ad = { media, mediaType, link };
  try{ await saveDB(); }catch(e){ db.ad = prevAd; msg.innerHTML = `<div class="msg err">Could not save: ${escapeHtml(e && e.message ? e.message : String(e))}.</div>`; return; }
  msg.innerHTML = `<div class="msg ok">Ad saved.</div>`;
  renderSiteSettings(); renderAdBanner();
}
function removeAd(){
  if(!confirm('Remove the top banner ad?')) return;
  db.ad = { media:null, mediaType:null, link:'' };
  saveDB();
  renderSiteSettings(); renderAdBanner();
}
function addGenreFromSettings(){
  const el = document.getElementById('siteNewGenre');
  const g = el.value.trim();
  if(!g) return;
  if(!db.genres.includes(g)) db.genres.push(g);
  saveDB();
  renderSiteSettings();
  renderSidebar();
}
function deleteGenre(g){
  if(!confirm('Delete genre "'+g+'"? It will be removed from any wallpapers that use it.')) return;
  db.genres = db.genres.filter(x=>x!==g);
  db.wallpapers.forEach(w=>{ w.genres = w.genres.filter(x=>x!==g); });
  if(activeGenre===g) activeGenre = null;
  saveDB();
  renderSiteSettings();
  renderSidebar();
}

/* ---------------- SETTINGS ---------------- */
function renderSettings(){
  document.getElementById('main').innerHTML = `
  <div class="panel">
    <h2>Settings</h2>
    <label>Appearance</label>
    <button class="btn secondary" onclick="setTheme('light')">☀ Light</button>
    <button class="btn secondary" onclick="setTheme('dark')">🌙 Dark</button>
    <p class="hint" style="margin-top:16px;">Currently: <b>${db.theme}</b> mode.</p>
  </div>`;
}
function setTheme(t){ db.theme = t; saveDB(); applyTheme(); renderSettings(); }

/* ---------------- HELPERS ---------------- */
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------------- ROOT RENDER ---------------- */
function render(){
  renderLogo();
  renderAdBanner();
  renderNav();
  renderSidebar();
  if(view==='browse') renderBrowse();
  else if(view==='add-wallpaper') renderAddWallpaper();
  else if(view==='add-sub') renderAddSub();
  else if(view==='users') renderUsers();
  else if(view==='account') renderAccount();
  else if(view==='settings') renderSettings();
  else if(view==='site-settings') renderSiteSettings();
}
async function init(){
  await loadDB();
  applyTheme();
  render();
}
init();
</script>
</body>
</html>
